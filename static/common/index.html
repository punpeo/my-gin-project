<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能业务处理中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>
                    <i class="fas fa-cogs"></i>
                    业务处理中心
                </h2>
                <p>一站式数据管理与智能分析平台</p>
            </div>
            
            <ul class="nav-list">
                <li class="nav-item active" data-target="excel-sales">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-layer-group nav-icon"></i>
                        </div>
                        <span class="nav-text">Excel分组汇总</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>
                
                <li class="nav-item" data-target="excel-fill">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-file-excel nav-icon"></i>
                        </div>
                        <span class="nav-text">Excel数据匹配填充</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>
                
                <li class="nav-item" data-target="stock">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-boxes-stacked nav-icon"></i>
                        </div>
                        <span class="nav-text">库存统计</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>
                
                <li class="nav-item" data-target="order-summary">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-clipboard-list nav-icon"></i>
                        </div>
                        <span class="nav-text">订单汇总</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>
                
                <li class="nav-item" data-target="shop-order">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-store nav-icon"></i>
                        </div>
                        <span class="nav-text">店铺订单统计</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>
                
                <li class="nav-item" data-target="cycle-sales">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-chart-line nav-icon"></i>
                        </div>
                        <span class="nav-text">周期销量统计</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>
                
                <div class="nav-divider"></div>
                
                <!-- 待开发模块1 -->
                <li class="nav-item" data-target="dev-module-1">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-rocket nav-icon"></i>
                        </div>
                        <span class="nav-text">智能分析模块</span>
                        <div class="nav-badge">
                            <span class="nav-status status-dev">开发中</span>
                        </div>
                    </a>
                </li>
                
                <!-- 待开发模块2 -->
                <li class="nav-item" data-target="dev-module-2">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-chart-pie nav-icon"></i>
                        </div>
                        <span class="nav-text">数据可视化</span>
                        <div class="nav-badge">
                            <span class="nav-status status-dev">开发中</span>
                        </div>
                    </a>
                </li>
            </ul>
            
            <div class="sidebar-footer">
                <div class="system-status">
                    <div class="status-info">
                        <div class="status-dot"></div>
                        <span class="status-text">系统运行正常</span>
                    </div>
                    <div class="time-display" id="currentTime">14:31:29</div>
                </div>
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <div class="content-header">
                <h1>智能业务处理中心</h1>
                <p>一体化数据管理与智能分析平台，赋能您的业务决策与流程优化</p>
            </div>

            <!-- 功能模块容器 -->
            <div id="modules-container">
                <!-- 模块将通过JavaScript动态加载 -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
