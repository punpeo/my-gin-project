<div class="panel-header">
    <div class="panel-title">
        <div class="panel-icon">
            <i class="fas fa-layer-group"></i>
        </div>
        <div>
            <h3>Excel分组汇总</h3>
            <p class="panel-subtitle">Excel数据分组与汇总统计，支持多条件聚合分析</p>
            <div class="module-badge">
                <i class="fas fa-check-circle"></i>
                独立模块
            </div>
        </div>
    </div>
</div>

<div class="module-stats">
    <div class="stat-item">
        <div class="stat-value">85%</div>
        <div class="stat-label">处理效率</div>
    </div>
    <div class="stat-item">
        <div class="stat-value">2.3s</div>
        <div class="stat-label">平均处理时间</div>
    </div>
    <div class="stat-item">
        <div class="stat-value">1,245</div>
        <div class="stat-label">今日处理量</div>
    </div>
</div>

<div class="form-grid">
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-folder-open"></i>
            根目录
        </label>
        <input type="text" class="form-control" value="E:/excel_files" placeholder="请输入Excel文件根目录">
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-filter"></i>
                匹配列
            </label>
            <input type="text" class="form-control" placeholder="例如：A 或 产品ID" value="A">
        </div>
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-equals"></i>
                匹配值（选填）
            </label>
            <input type="text" class="form-control" placeholder="例如：P001">
        </div>
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-bookmark"></i>
                保留列
            </label>
            <input type="text" class="form-control" placeholder="例如：B,C 或 产品ID,产品名称" value="B,C">
        </div>
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-calculator"></i>
                求和列
            </label>
            <input type="text" class="form-control" placeholder="例如：D 或 销量" value="D">
        </div>
    </div>
    
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-file-export"></i>
            输出文件名（选填）
        </label>
        <input type="text" class="form-control" placeholder="例如：分组汇总结果.xlsx">
    </div>
    
    <button class="btn btn-primary">
        <i class="fas fa-cogs"></i>
        开始分组汇总
    </button>
</div>
