<div class="panel-header">
    <div class="panel-title">
        <div class="panel-icon">
            <i class="fas fa-boxes-stacked"></i>
        </div>
        <div>
            <h3>库存统计</h3>
            <p class="panel-subtitle">实时库存数据统计与分析</p>
            <div class="module-badge">
                <i class="fas fa-check-circle"></i>
                独立模块
            </div>
        </div>
    </div>
</div>

<div class="module-stats">
    <div class="stat-item">
        <div class="stat-value">实时</div>
        <div class="stat-label">数据更新</div>
    </div>
    <div class="stat-item">
        <div class="stat-value">0.5s</div>
        <div class="stat-label">刷新间隔</div>
    </div>
    <div class="stat-item">
        <div class="stat-value">24/7</div>
        <div class="stat-label">运行状态</div>
    </div>
</div>

<div class="form-grid">
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-folder-open"></i>
            文件根目录
        </label>
        <input type="text" class="form-control" value="E:\kucun" placeholder="请输入库存文件路径">
    </div>
    
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-file"></i>
            基准文件名
        </label>
        <input type="text" class="form-control" value="kucun.xlsx" placeholder="请输入文件名">
    </div>
    
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-calendar-days"></i>
            操作日期
        </label>
        <div style="display: flex; gap: 12px; align-items: center;">
            <input type="text" class="form-control" value="1月22日" placeholder="x月x日" style="flex: 1;">
            <span style="color: var(--success); font-weight: 600; font-size: 0.95rem;">
                <i class="fas fa-check-circle"></i> 格式正确
            </span>
        </div>
    </div>
    
    <div class="data-cards">
        <div class="data-card">
            <div class="data-value">1,248</div>
            <div class="data-label">总库存量</div>
        </div>
        <div class="data-card">
            <div class="data-value">342</div>
            <div class="data-label">今日入库</div>
        </div>
        <div class="data-card">
            <div class="data-value">89</div>
            <div class="data-label">今日出库</div>
        </div>
    </div>
    
    <div class="btn-group">
        <button class="btn btn-primary">
            <i class="fas fa-chart-bar"></i>
            执行统计
        </button>
        <button class="btn btn-danger">
            <i class="fas fa-trash-can"></i>
            删除日期列
        </button>
    </div>
</div>
