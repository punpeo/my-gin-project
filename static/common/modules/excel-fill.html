<div class="panel-header">
    <div class="panel-title">
        <div class="panel-icon">
            <i class="fas fa-file-excel"></i>
        </div>
        <div>
            <h3>Excel数据匹配填充</h3>
            <p class="panel-subtitle">快速匹配和填充Excel表格数据</p>
            <div class="module-badge">
                <i class="fas fa-check-circle"></i>
                独立模块
            </div>
        </div>
    </div>
</div>

<div class="module-stats">
    <div class="stat-item">
        <div class="stat-value">92%</div>
        <div class="stat-label">匹配准确率</div>
    </div>
    <div class="stat-item">
        <div class="stat-value">1.8s</div>
        <div class="stat-label">平均处理时间</div>
    </div>
    <div class="stat-item">
        <div class="stat-value">890</div>
        <div class="stat-label">今日处理量</div>
    </div>
</div>

<div class="form-grid">
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-folder-open"></i>
            文件根目录
        </label>
        <input type="text" class="form-control" value="E:\Xyq-Works\Excel_Fill" placeholder="请输入文件路径">
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-search"></i>
                待输入表匹配列
            </label>
            <input type="text" class="form-control" placeholder="例如：A" value="A">
        </div>
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-edit"></i>
                待输入表填充列
            </label>
            <input type="text" class="form-control" placeholder="例如：B" value="B">
        </div>
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-columns"></i>
                目标表匹配列
            </label>
            <input type="text" class="form-control" placeholder="例如：A" value="A">
        </div>
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-database"></i>
                目标表取值列
            </label>
            <input type="text" class="form-control" placeholder="例如：C" value="C">
        </div>
    </div>
    
    <button class="btn btn-primary">
        <i class="fas fa-play-circle"></i>
        开始匹配填充
    </button>
</div>
