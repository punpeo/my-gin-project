<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>punpeo甜菜</title>

    <!-- 样式文件：保留CDN资源，本地资源添加/static前缀 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- 核心修正：./css → /static/css -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/style-modules.css">

    <style>
        /* 加载状态样式 */
        .modules-container {
            position: relative;
            min-height: 400px;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(2px);
        }

        .module-switch-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            animation: slideInRight 0.3s ease;
            display: none;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* 确保所有必要的样式都定义 */
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #10b981;
            --danger: #ef4444;
            --success: #10b981;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --border-radius: 12px;
            --border-radius-lg: 16px;
            --border-radius-xl: 20px;
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>
    <div class="main-container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>
                    <i class="fas fa-cogs"></i>
                    功能模块
                </h2>
                <p>赋能解忧</p>
            </div>

            <ul class="nav-list">

                <li class="nav-item" data-target="product-query">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-chart-pie nav-icon"></i>
                        </div>
                        <span class="nav-text">商品查询</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>

                <!-- 新增：快麦商品查询 -->
                <li class="nav-item" data-target="kuaimai-product-query">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-barcode nav-icon"></i>
                        </div>
                        <span class="nav-text">快麦商品查询</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>

                <li class="nav-item" data-target="product">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-rocket nav-icon"></i>
                        </div>
                        <span class="nav-text">商品信息导入</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>

                <div class="nav-divider"></div>

                <li class="nav-item" data-target="stock">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-boxes-stacked nav-icon"></i>
                        </div>
                        <span class="nav-text">库存统计</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>

                <li class="nav-item active" data-target="excel-sales">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-layer-group nav-icon"></i>
                        </div>
                        <span class="nav-text">Excel分组汇总</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>

                <li class="nav-item" data-target="excel-fill">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-file-excel nav-icon"></i>
                        </div>
                        <span class="nav-text">Excel数据匹配填充</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>

                <div class="nav-divider"></div>

                <li class="nav-item" data-target="order-summary">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-clipboard-list nav-icon"></i>
                        </div>
                        <span class="nav-text">订单汇总</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>

                <li class="nav-item" data-target="shop-order">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-store nav-icon"></i>
                        </div>
                        <span class="nav-text">店铺订单统计</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>

                <li class="nav-item" data-target="cycle-sales">
                    <a href="#" class="nav-link">
                        <div class="nav-icon-wrapper">
                            <div class="nav-icon-bg"></div>
                            <i class="fas fa-chart-line nav-icon"></i>
                        </div>
                        <span class="nav-text">周期销量统计</span>
                        <div class="nav-badge">
                            <span class="nav-status status-active">在线</span>
                            <div class="nav-indicator"></div>
                        </div>
                    </a>
                </li>

            </ul>

            <div class="sidebar-footer">
                <div class="system-status">
                    <div class="status-info">
                        <div class="status-dot"></div>
                        <span class="status-text">系统运行正常</span>
                    </div>
                    <div class="time-display" id="currentTime">00:00:00</div>
                </div>
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <div class="module-switch-indicator" id="moduleIndicator">
                正在切换到: <span id="moduleName"></span>
            </div>

            <div class="content-header">
                <h1>模块实现区域</h1>
                <p></p>
                <!-- 圆形头像：核心修正 → /static/images/ -->
                <div class="content-avatar">
                    <img src="/static/images/chenxia.png" alt="用户头像">
                </div>
            </div>

            <!-- 功能模块容器 -->
            <div class="modules-container" id="modules-container">
                <div class="function-panel active">
                    <div class="dev-panel">
                        <div class="dev-content">
                            <i class="fas fa-spinner fa-spin"></i>
                            <h4>正在初始化系统</h4>
                            <p>请稍候，正在加载模块...</p>
                        </div>
                    </div>
                </div>

                <div class="loading-overlay" id="loadingOverlay" style="display: none;">
                    <div class="module-loading-content">
                        <i class="fas fa-spinner fa-spin"></i>
                        <h4>正在加载模块</h4>
                        <p id="loadingText">请稍候...</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript文件：核心修正 → /static/js/ -->
    <script src="/static/js/main.js"></script>
    <script src="/static/js/modules.js"></script>
</body>

</html>
