<div class="form-grid">
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-folder-open"></i>
            文件根目录
        </label>
        <input type="text" class="form-control" value="E:\Xyq-Works\Excel_Fill" id="excel-fill-root-dir"
            placeholder="请输入文件路径">
    </div>

    <div class="form-row">
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-search"></i>
                待输入表匹配列
            </label>
            <input type="text" class="form-control" placeholder="例如：A" value="A" id="excel-fill-source-match-col">
        </div>
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-edit"></i>
                待输入表填充列
            </label>
            <input type="text" class="form-control" placeholder="例如：B" value="B" id="excel-fill-source-fill-col">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-columns"></i>
                目标表匹配列
            </label>
            <input type="text" class="form-control" placeholder="例如：A" value="A" id="excel-fill-target-match-col">
        </div>
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-database"></i>
                目标表取值列
            </label>
            <input type="text" class="form-control" placeholder="例如：C" value="C" id="excel-fill-target-value-col">
        </div>
    </div>

    <div class="data-cards">
        <div class="data-card">
            <div class="data-value">0</div>
            <div class="data-label">总行数</div>
        </div>
        <div class="data-card">
            <div class="data-value">0</div>
            <div class="data-label">填充行数</div>
        </div>
        <div class="data-card">
            <div class="data-value">0</div>
            <div class="data-label">跳过空行数量</div>
        </div>
    </div>
    
    <!-- 新增：操作结果展示区（初始空白） -->
    <div class="response-container" id="stock-response-container">
        <label class="form-label">
            <i class="fas fa-terminal"></i>
            操作结果
        </label>
        <div class="response-content" id="stock-response-content">
            <!-- 初始空白，无占位文字 -->
        </div>
    </div>

    <button class="btn btn-primary" id="excel-fill-process-btn">
        <i class="fas fa-play-circle"></i>
        开始匹配填充
    </button>
</div>
