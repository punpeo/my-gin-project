<div class="panel-header">
    <div class="panel-title">
        <div class="panel-icon">
            <i class="fas fa-chart-line"></i>
        </div>
        <div>
            <h3>产品周期销量统计</h3>
            <p class="panel-subtitle">产品周期性销售数据分析</p>
            <div class="module-badge">
                <i class="fas fa-check-circle"></i>
                独立模块
            </div>
        </div>
    </div>
</div>

<div class="module-stats">
    <div class="stat-item">
        <div class="stat-value" id="cycle-sales-cycle-type">周/月/季</div>
        <div class="stat-label">周期类型</div>
    </div>
    <div class="stat-item">
        <div class="stat-value" id="cycle-sales-cycle-days">5</div>
        <div class="stat-label">周期天数</div>
    </div>
    <div class="stat-item">
        <div class="stat-value" id="cycle-sales-product-count">256</div>
        <div class="stat-label">产品数</div>
    </div>
</div>

<div class="form-grid">
    <div class="form-row">
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-folder-open"></i>
                文件根目录
            </label>
            <input type="text" class="form-control" value="E:\kucun" 
                   id="cycle-sales-base-path" placeholder="请输入文件路径">
        </div>

        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-file"></i>
                基准文件名
            </label>
            <input type="text" class="form-control" value="kucun.xlsx" 
                   id="cycle-sales-base-filename" placeholder="请输入文件名">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-arrow-right-to-bracket"></i>
                起始列
            </label>
            <select class="form-control" id="cycle-sales-start-column">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C" selected>C</option>
                <option value="D">D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="H">H</option>
                <option value="I">I</option>
                <option value="J">J</option>
                <option value="K">K</option>
                <option value="L">L</option>
                <option value="M">M</option>
                <option value="N">N</option>
                <option value="O">O</option>
                <option value="P">P</option>
                <option value="Q">Q</option>
                <option value="R">R</option>
                <option value="S">S</option>
                <option value="T">T</option>
                <option value="U">U</option>
                <option value="V">V</option>
                <option value="W">W</option>
                <option value="X">X</option>
                <option value="Y">Y</option>
                <option value="Z">Z</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-arrow-right-from-bracket"></i>
                结束列
            </label>
            <select class="form-control" id="cycle-sales-end-column">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D" selected>D</option>
                <option value="E">E</option>
                <option value="F">F</option>
                <option value="G">G</option>
                <option value="H">H</option>
                <option value="I">I</option>
                <option value="J">J</option>
                <option value="K">K</option>
                <option value="L">L</option>
                <option value="M">M</option>
                <option value="N">N</option>
                <option value="O">O</option>
                <option value="P">P</option>
                <option value="Q">Q</option>
                <option value="R">R</option>
                <option value="S">S</option>
                <option value="T">T</option>
                <option value="U">U</option>
                <option value="V">V</option>
                <option value="W">W</option>
                <option value="X">X</option>
                <option value="Y">Y</option>
                <option value="Z">Z</option>
            </select>
        </div>
    </div>
    
    <!-- 后端响应结果展示区 -->
    <div class="response-container" id="cycle-sales-response-container">
        <label class="form-label">
            <i class="fas fa-terminal"></i>
            执行结果
        </label>
        <!-- 初始为空，可通过JS动态填充内容 -->
        <div class="response-content" id="cycle-sales-response-content">
            <p class="response-placeholder" id="cycle-sales-response-placeholder">点击「操作」后，执行结果将展示在此处</p>
        </div>
    </div>

    <button class="btn btn-primary" id="cycle-sales-statistic-btn">
        <i class="fas fa-chart-pie"></i>
        执行周期销量统计
    </button>
</div>
