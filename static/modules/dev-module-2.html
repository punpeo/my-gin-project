<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品信息管理系统</title>
    <!-- 引入外部资源（Font Awesome+Inter字体） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- 引入独立CSS样式文件 -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* 新增选项卡样式（适配原有风格，无冲突） */
        .tab-nav {
            display: flex;
            gap: 8px;
            margin: 20px 0 24px;
            border-bottom: 2px solid var(--gray-200);
            padding-bottom: 8px;
        }
        .tab-item {
            padding: 12px 24px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-600);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .tab-item i {
            font-size: 1.1rem;
        }
        .tab-item.active {
            background: var(--primary-ultra-light);
            color: var(--primary-dark);
            border-color: var(--primary-light);
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.1);
        }
        .tab-item:hover {
            color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }
        /* 适配主容器宽度，移除左侧栏间隙 */
        .main-container {
            max-width: 1600px;
            padding: 20px;
            margin: 0 auto;
        }
        /* 响应式适配选项卡 */
        @media (max-width: 768px) {
            .tab-nav {
                flex-wrap: wrap;
                gap: 4px;
            }
            .tab-item {
                padding: 8px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 主内容区域（无左侧栏） -->
        <main class="main-content">
            <!-- 商品查询面板（默认激活） -->
            <div class="function-panel active" id="query-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <div class="panel-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <div>
                            <h3>商品查询</h3>
                            <p class="panel-subtitle">多条件组合查询，精准定位商品信息</p>
                            <div class="module-badge">
                                <i class="fas fa-filter"></i>
                                支持条码/店铺/商品名/事业部编码多条件查询
                            </div>
                        </div>
                    </div>
                </div>

                <form class="form-grid" id="query-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-barcode"></i> 商品条码</label>
                            <input type="text" class="form-control" name="barCode" placeholder="请输入商品条码（如6977676160984）">
                        </div>
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-store"></i> 店铺名称</label>
                            <input type="text" class="form-control" name="shop" placeholder="请输入店铺名称（模糊匹配）">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-box"></i> 商品名称</label>
                            <input type="text" class="form-control" name="productName" placeholder="请输入商品名称（模糊匹配）">
                        </div>
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-code"></i> 事业部编码</label>
                            <input type="text" class="form-control" name="businessCode" placeholder="请输入事业部编码">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-id-card"></i> 商家标识</label>
                            <input type="text" class="form-control" name="merchantCode" placeholder="请输入商家标识">
                        </div>
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-sort"></i> 排序方式</label>
                            <select class="form-control" name="sortType">
                                <option value="created_at_desc">创建时间（从新到旧）</option>
                                <option value="created_at_asc">创建时间（从旧到新）</option>
                                <option value="product_name_asc">商品名称（正序）</option>
                            </select>
                        </div>
                    </div>

                    <div class="btn-group-2" style="margin-top: 16px;">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-search"></i> 执行查询
                        </button>
                        <button type="reset" class="btn btn-secondary">
                            <i class="fas fa-refresh"></i> 重置条件
                        </button>
                    </div>

                    <!-- 数据概览卡片 -->
                    <div class="data-cards-4" style="margin-top: 24px;">
                        <div class="data-card" id="card-total">
                            <div class="data-value">0</div>
                            <div class="data-label">查询总数</div>
                        </div>
                        <div class="data-card" id="card-shop">
                            <div class="data-value">0</div>
                            <div class="data-label">店铺数</div>
                        </div>
                        <div class="data-card high-value" id="card-new">
                            <div class="data-value">0</div>
                            <div class="data-label">今日新增</div>
                        </div>
                        <div class="data-card" id="card-status">
                            <div class="data-value">正常</div>
                            <div class="data-label">数据状态</div>
                        </div>
                    </div>

                    <!-- 响应结果展示 -->
                    <div class="response-container-lg" style="margin-top: 24px;">
                        <label class="form-label"><i class="fas fa-file-code"></i> 查询结果</label>
                        <div class="response-content-lg" id="query-result">
                            请输入查询条件并点击「执行查询」，结果将展示在此处...
                        </div>
                    </div>
                </form>
            </div>

            <!-- 新增商品面板 -->
            <div class="function-panel" id="add-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <div class="panel-icon">
                            <i class="fas fa-plus"></i>
                        </div>
                        <div>
                            <h3>新增商品</h3>
                            <p class="panel-subtitle">添加新商品信息至数据库，所有标*字段为必填项</p>
                            <div class="module-badge">
                                <i class="fas fa-save"></i>
                                提交后自动生成创建/更新时间
                            </div>
                        </div>
                    </div>
                </div>

                <form class="form-grid" id="add-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-store"></i> 店铺名称 <span
                                    style="color: var(--danger);">*</span></label>
                            <input type="text" class="form-control" name="shop" placeholder="请输入店铺名称（最多50字）" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-box"></i> 商品名称 <span
                                    style="color: var(--danger);">*</span></label>
                            <input type="text" class="form-control" name="productName" placeholder="请输入商品名称（最多100字）"
                                required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-barcode"></i> 商品条码 <span
                                    style="color: var(--danger);">*</span></label>
                            <input type="text" class="form-control" name="barCode" placeholder="请输入商品条码（30字内，唯一）" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label"><i class="fas fa-code"></i> 事业部编码 <span
                                    style="color: var(--danger);">*</span></label>
                            <input type="text" class="form-control" name="businessCode" placeholder="请输入事业部编码（30字内，唯一）"
                                required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-id-card"></i> 商家标识 <span
                                style="color: var(--danger);">*</span></label>
                        <input type="text" class="form-control" name="merchantCode" placeholder="请输入商家标识（30字内，唯一）" required>
                    </div>

                    <div class="btn-group-1" style="margin-top: 16px;">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 提交新增
                        </button>
                    </div>

                    <!-- 响应结果展示 -->
                    <div class="response-container" style="margin-top: 24px;">
                        <label class="form-label"><i class="fas fa-file-code"></i> 操作结果</label>
                        <div class="response-content" id="add-result">
                            请填写商品信息并点击「提交新增」，结果将展示在此处...
                        </div>
                    </div>
                </form>
            </div>

            <!-- 更新商品面板 -->
            <div class="function-panel" id="update-panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <div class="panel-icon">
                            <i class="fas fa-edit"></i>
                        </div>
                        <div>
                            <h3>更新商品</h3>
                            <p class="panel-subtitle">通过商品条码查询并更新现有商品信息，条码不可修改</p>
                            <div class="module-badge">
                                <i class="fas fa-sync"></i>
                                提交后自动更新更新时间
                            </div>
                        </div>
                    </div>
                </div>

                <form class="form-grid" id="update-form">
                    <!-- 第一步：查询条码 -->
                    <div class="form-group" style="margin-bottom: 24px;">
                        <label class="form-label"><i class="fas fa-barcode"></i> 商品条码 <span
                                style="color: var(--danger);">*</span></label>
                        <div style="display: flex; gap: 16px;">
                            <input type="text" class="form-control" name="barCode" placeholder="请输入要更新的商品条码"
                                style="flex: 1;" required>
                            <button type="button" class="btn btn-secondary" id="search-barcode" style="width: 180px;">
                                <i class="fas fa-search"></i> 查询商品
                            </button>
                        </div>
                    </div>

                    <!-- 第二步：更新信息（初始隐藏，查询后显示） -->
                    <div id="update-form-content" style="display: none;">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-store"></i> 店铺名称</label>
                                <input type="text" class="form-control" name="shop" placeholder="请输入店铺名称（最多50字）">
                            </div>
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-box"></i> 商品名称</label>
                                <input type="text" class="form-control" name="productName" placeholder="请输入商品名称（最多100字）">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-code"></i> 事业部编码</label>
                                <input type="text" class="form-control" name="businessCode" placeholder="请输入事业部编码（30字内，唯一）">
                            </div>
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-id-card"></i> 商家标识</label>
                                <input type="text" class="form-control" name="merchantCode" placeholder="请输入商家标识（30字内，唯一）">
                            </div>
                        </div>

                        <div class="btn-group-1" style="margin-top: 16px;">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> 提交更新
                            </button>
                        </div>
                    </div>

                    <!-- 响应结果展示 -->
                    <div class="response-container" style="margin-top: 24px;">
                        <label class="form-label"><i class="fas fa-file-code"></i> 操作结果</label>
                        <div class="response-content" id="update-result">
                            请输入商品条码并点击「查询商品」，查询成功后可编辑信息并提交更新...
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- 引入独立JavaScript脚本文件 -->
    <script src="js/main.js"></script>
    <script>
        // 覆盖原有左侧栏切换逻辑，新增选项卡切换功能（不修改原main.js）
        document.addEventListener('DOMContentLoaded', function() {
            const tabItems = document.querySelectorAll('.tab-item');
            const panels = document.querySelectorAll('.function-panel');
            
            tabItems.forEach(item => {
                item.addEventListener('click', function() {
                    // 移除所有激活状态
                    tabItems.forEach(i => i.classList.remove('active'));
                    panels.forEach(p => p.classList.remove('active'));
                    // 添加当前激活状态
                    this.classList.add('active');
                    const panelId = this.getAttribute('data-panel');
                    document.getElementById(panelId).classList.add('active');
                });
            });
        });
    </script>
</body>
</html>
