<div class="panel-header">
    <div class="panel-title">
        <div class="panel-icon">
            <i class="fas fa-chart-line"></i>
        </div>
        <div>
            <h3>产品周期销量统计</h3>
            <p class="panel-subtitle">产品周期性销售数据分析</p>
            <div class="module-badge">
                <i class="fas fa-check-circle"></i>
                独立模块
            </div>
        </div>
    </div>
</div>

<div class="module-stats">
    <div class="stat-item">
        <div class="stat-value">周/月/季</div>
        <div class="stat-label">周期类型</div>
    </div>
    <div class="stat-item">
        <div class="stat-value">4.2s</div>
        <div class="stat-label">分析时间</div>
    </div>
    <div class="stat-item">
        <div class="stat-value">256</div>
        <div class="stat-label">产品数</div>
    </div>
</div>

<div class="form-grid">
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-folder-open"></i>
            文件根目录
        </label>
        <input type="text" class="form-control" value="E:\kucun" placeholder="请输入文件路径">
    </div>
    
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-file"></i>
            基准文件名
        </label>
        <input type="text" class="form-control" value="kucun.xlsx" placeholder="请输入文件名">
    </div>
    
    <div class="form-row">
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-arrow-right-to-bracket"></i>
                起始列
            </label>
            <select class="form-control">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C" selected>C</option>
                <option value="D">D</option>
                <option value="E">E</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">
                <i class="fas fa-arrow-right-from-bracket"></i>
                结束列
            </label>
            <select class="form-control">
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D" selected>D</option>
                <option value="E">E</option>
            </select>
        </div>
    </div>
    
    <button class="btn btn-primary">
        <i class="fas fa-chart-pie"></i>
        执行周期销量统计
    </button>
</div>
