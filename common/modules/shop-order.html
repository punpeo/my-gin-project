<div class="panel-header">
    <div class="panel-title">
        <div class="panel-icon">
            <i class="fas fa-store"></i>
        </div>
        <div>
            <h3>补单店铺订单统计</h3>
            <p class="panel-subtitle">店铺补单订单数据分析</p>
            <div class="module-badge">
                <i class="fas fa-check-circle"></i>
                独立模块
            </div>
        </div>
    </div>
</div>

<div class="form-grid">
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-folder-open"></i>
            文件根目录
        </label>
        <input type="text" class="form-control" value="E:\tongjidingdan" 
               id="shop-order-base-path" placeholder="请输入订单统计路径">
    </div>

    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-cloud-arrow-up"></i>
            上传文件
        </label>
        <div class="file-upload-area" id="shop-order-file-upload-area">
            <i class="fas fa-cloud-upload-alt" id="shop-order-upload-icon"></i>
            <p id="shop-order-upload-text">点击或拖拽文件上传(可选)</p>
            <span id="shop-order-upload-format-hint">支持 .xlsx, .xls 格式</span>
        </div>
    </div>

    <div class="data-cards">
        <div class="data-card">
            <div class="data-value" id="shop-order-shop-count">0</div>
            <div class="data-label">总店铺数</div>
        </div>
        <div class="data-card">
            <div class="data-value" id="shop-order-total-order">0</div>
            <div class="data-label">总订单数</div>
        </div>
        <div class="data-card">
            <div class="data-value" id="shop-order-total-amount">0</div>
            <div class="data-label">总金额</div>
        </div>
    </div>

    <div class="btn-group-2">
        <button class="btn btn-primary" id="shop-order-statistic-by-path-btn">
            <i class="fas fa-chart-line"></i>
            执行路径下统计
        </button>
        <button class="btn btn-primary" id="shop-order-statistic-by-upload-btn">
            <i class="fas fa-chart-line"></i>
            执行上传文件统计
        </button>
    </div>
</div>
