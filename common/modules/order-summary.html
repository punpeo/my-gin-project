<div class="panel-header">
    <div class="panel-title">
        <div class="panel-icon">
            <i class="fas fa-clipboard-list"></i>
        </div>
        <div>
            <h3>订单汇总</h3>
            <p class="panel-subtitle">订单数据汇总与处理</p>
            <div class="module-badge">
                <i class="fas fa-check-circle"></i>
                独立模块
            </div>
        </div>
    </div>
</div>

<div class="module-stats">
    <div class="stat-item">
        <div class="stat-value">98%</div>
        <div class="stat-label">成功率</div>
    </div>
    <div class="stat-item">
        <div class="stat-value">3.1s</div>
        <div class="stat-label">平均处理时间</div>
    </div>
    <div class="stat-item">
        <div class="stat-value">2,340</div>
        <div class="stat-label">今日订单</div>
    </div>
</div>

<div class="form-grid">
    <a href="#" class="btn btn-secondary" style="margin-bottom: 20px;">
        <i class="fas fa-download"></i>
        下载模板文件
    </a>
    
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-user-tie"></i>
            负责人
        </label>
        <select class="form-control">
            <option value="">默认（不指定）</option>
            <option value="曾庆隆">曾庆隆</option>
            <option value="唐剑雨">唐剑雨</option>
            <option value="杨婷">杨婷</option>
            <option value="陈文海">陈文海</option>
            <option value="唐何新">唐何新</option>
        </select>
    </div>
    
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-cloud-arrow-up"></i>
            上传文件
        </label>
        <div class="file-upload-area">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>点击或拖拽文件上传</p>
            <span>支持 .xlsx, .xls 格式</span>
        </div>
    </div>
    
    <button class="btn btn-primary">
        <i class="fas fa-rocket"></i>
        上传并处理数据
    </button>
</div>
