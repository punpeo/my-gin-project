<div class="panel-header">
    <div class="panel-title">
        <div class="panel-icon">
            <i class="fas fa-clipboard-list"></i>
        </div>
        <div>
            <h3>订单汇总</h3>
            <p class="panel-subtitle">订单数据汇总与处理</p>
            <div class="module-badge">
                <i class="fas fa-check-circle"></i>
                独立模块
            </div>
        </div>
    </div>
</div>
<div class="form-grid">
    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-user-tie"></i>
            负责人
        </label>
        <select class="form-control">
            <option value="">默认（不指定）</option>
            <option value="曾庆隆">曾庆隆</option>
            <option value="唐剑雨">唐剑雨</option>
            <option value="杨婷">杨婷</option>
            <option value="陈文海">陈文海</option>
            <option value="唐何新">唐何新</option>
        </select>
    </div>

    <div class="form-group">
        <label class="form-label">
            <i class="fas fa-cloud-arrow-up"></i>
            上传文件
        </label>
        <div class="file-upload-area">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>点击或拖拽文件上传</p>
            <span>支持 .xlsx, .xls 格式</span>
        </div>
    </div>

    <div class="data-cards-4">
        <div class="data-card">
            <div class="data-value">48</div>
            <div class="data-label">店铺数量</div>
        </div>
        <div class="data-card">
            <div class="data-value">1,204</div>
            <div class="data-label">总订单数</div>
        </div>
        <div class="data-card">
            <div class="data-value">¥58,430</div>
            <div class="data-label">总金额</div>
        </div>
         <div class="data-card">
            <div class="data-value">0</div>
            <div class="data-label">重复订单</div>
        </div>
    </div>


    <div class="btn-group-2">
        <button class="btn btn-secondary">
            <i class="fas fa-cogs"></i>
            下载模板文件
        </button>
        <button class="btn btn-primary">
            <i class="fas fa-rocket"></i>
            上传并处理数据
        </button>
    </div>
</div>
