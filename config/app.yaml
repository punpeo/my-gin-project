server:
  addr: ":8080"
log:
  level: "info"
  path: "./logs"
# 库存清理定时任务配置
stock_cleanup:
  enable: true               # 是否启用定时清理任务
  cron_expression: "0 0 0 * * *"  # （可自定义，如 "0 30 23 * * *" 表示每天23:30执行）
  base_path: "E:\\kucun"         # 默认清理目录
  base_file_name: "kucun.xlsx"   # 基准文件名

product_db:
  dsn: "data/product.db"
  log_level: 3  # 1=Silent, 2=Error, 3=Warn, 4=Info
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

sales_export:
  source_dir: "E:\\sales_data"
  template: "模板.xlsx"
  output_dir: "E:\\sales_data"
  
excel_merge:
  source_dir: "E:/V4/excel_merge/data"
  output_dir: "E:/V4/excel_merge/output_data"